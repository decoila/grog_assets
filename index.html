<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Grog</title>

  <!-- Starts the connection to Apps Script's servers as early as
       possible, in parallel with this page's own load, rather than
       waiting until the JS below has run before even beginning. -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.google.com">

  <!-- Real manifest gets swapped in dynamically below, personalized
       per visitor. This static file is just the fallback for the very
       first instant before that JS runs. -->
  <link rel="manifest" id="manifest-link" href="manifest.json">
  <link rel="apple-touch-icon" href="grog-icon-192.png">
  <link rel="icon" href="grog-icon-192.png">
  <meta name="theme-color" content="#170B2E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Grog">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #170B2E; }
    iframe { border: none; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>

  <iframe id="app-frame" src="about:blank" title="Grog"></iframe>

  <script>
    // TODO: this must exactly match your real Apps Script deployment URL.
    var APP_URL = 'https://script.google.com/macros/s/AKfycbxww1W-qCLQBDnC3Ea5W19x0v9jBMGHutCWFdKijZn_bysAzRVPUxhmJznAKndgl62R/exec';

    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');

    // Fallback: if this launch has no code (e.g. an Android install
    // that reopened via a generic start_url rather than preserving the
    // query string), fall back to whichever code was last used
    // successfully on this device, rather than dropping to a blank
    // logged-out state.
    if (code) {
      try { localStorage.setItem('grog_code', code); } catch (e) {}
    } else {
      try { code = localStorage.getItem('grog_code'); } catch (e) {}
    }

    document.getElementById('app-frame').src = code ? (APP_URL + '?code=' + encodeURIComponent(code)) : APP_URL;

    // Build a manifest with THIS visitor's code baked into start_url,
    // so their installed icon always relaunches as them. GitHub Pages
    // can't generate this server-side, so it's built here client-side
    // as a Blob URL instead, swapped in before the browser evaluates
    // installability.
    var manifest = {
      name: 'Grog',
      short_name: 'Grog',
      start_url: code ? ('index.html?code=' + encodeURIComponent(code)) : 'index.html',
      display: 'standalone',
      background_color: '#170B2E',
      theme_color: '#170B2E',
      icons: [
        { src: 'grog-icon-192.png', sizes: '192x192', type: 'image/png' },
        { src: 'grog-icon-512.png', sizes: '512x512', type: 'image/png' }
      ]
    };
    var blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    document.getElementById('manifest-link').href = URL.createObjectURL(blob);
  </script>

</body>
</html>
